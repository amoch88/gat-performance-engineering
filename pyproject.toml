[project]
name = "dgl-performance-model"
version = "0.1.0"
description = "Reproducible CPU stock DGL GAT forward-pass measurements"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dgl==1.1.3",
  "torch==2.2.2+cpu",
  "numpy==1.26.4",
  "scipy==1.12.0",
  "packaging==24.2",  # DGL 1.1.3 imports this without declaring it.
]

[tool.uv]
package = false
required-version = "==0.13.4"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
